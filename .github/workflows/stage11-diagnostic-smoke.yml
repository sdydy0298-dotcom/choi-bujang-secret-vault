name: Stage 11 diagnostic probe smoke
on:
  push:
    paths:
      - .github/workflows/stage11-diagnostic-smoke.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Confirm production browser and private telemetry collector
        shell: bash
        run: |
          set -euo pipefail
          base='https://secret-vault-sdydy0298.vercel.app'
          for attempt in 1 2 3 4 5 6 7 8; do
            if curl -fsSL --max-time 15 "${base}/" | grep -q 'window.stage11Trace'; then
              break
            fi
            sleep 5
          done
          curl -fsSL --max-time 15 "${base}/" | grep -q 'window.stage11Trace'
          # A synthetic known trace ID, never a real user's tracking identifier.
          status=$(curl --silent --show-error --max-time 15 --output /tmp/aleph-stage11-diag --write-out '%{http_code}' \
            "${base}/api/auth-config?stage11=html_loaded&traceId=00000000-0000-4000-8000-000000000011")
          echo "Synthetic marker HTTP ${status}"
          test "${status}" = '200'
          jq -e '.url and .publishableKey' /tmp/aleph-stage11-diag >/dev/null
          status=$(curl --silent --show-error --max-time 15 --output /tmp/aleph-stage11-bad --write-out '%{http_code}' \
            "${base}/api/auth-config?stage11=arbitrary&traceId=00000000-0000-4000-8000-000000000011")
          echo "Unknown marker HTTP ${status}"
          test "${status}" = '400'
          profile=$(mktemp -d)
          timeout 42s google-chrome --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu \
            --disable-extensions --user-data-dir="${profile}" --virtual-time-budget=10000 \
            --dump-dom "${base}/" >/tmp/aleph-stage11-diag-dom 2>/tmp/aleph-stage11-diag-chrome || true
          grep -q '<span id="auth-state" class="state">로그아웃됨</span>' /tmp/aleph-stage11-diag-dom
          echo 'PASS: page initialized and strict diagnostic marker was accepted'
          rm -rf "${profile}"
