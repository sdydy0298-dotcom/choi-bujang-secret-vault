name: Import verified Keshev starter (one time)
on:
  push:
    branches:
      - keshev
    paths:
      - .github/workflows/keshev-starter-import.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-starter:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout only the new Keshev branch
        uses: actions/checkout@v4
        with:
          ref: keshev
          persist-credentials: true
      - name: Download and verify the exact uploaded starter archive
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import io
          import json
          import os
          import pathlib
          import sys
          import urllib.request
          import zipfile

          archive_url = 'https://aleph-workbench-downloads.vercel.app/alekov-starter-0.2.11.zip'
          expected_archive_sha256 = 'd57005384b36bd87bf7ad59926d11c3fc3054dc8574ccd9d788db47923477266'
          target_dir = pathlib.Path('on-client')
          if target_dir.exists():
              sys.exit('Safety stop: on-client already exists, refusing to overwrite.')
          request = urllib.request.Request(archive_url, headers={'User-Agent': 'Keshev-Starter-Importer/1.0'})
          with urllib.request.urlopen(request, timeout=45) as response:
              data = response.read(4 * 1024 * 1024 + 1)
          if len(data) > 4 * 1024 * 1024:
              sys.exit('Safety stop: archive unexpectedly large.')
          actual_sha256 = hashlib.sha256(data).hexdigest()
          if actual_sha256 != expected_archive_sha256:
              sys.exit('Safety stop: downloaded archive does not match student uploaded archive SHA256.')
          with zipfile.ZipFile(io.BytesIO(data)) as archive:
              names = archive.namelist()
              manifest_name = 'on-client/.on-starter-manifest.json'
              if manifest_name not in names:
                  sys.exit('Safety stop: missing starter manifest.')
              manifest = json.loads(archive.read(manifest_name).decode('utf-8'))
              hashes = manifest.get('sourceHashes')
              if manifest.get('version') != 1 or not isinstance(hashes, dict):
                  sys.exit('Safety stop: unexpected manifest structure.')
              expected_names = {f'on-client/{p}' for p in hashes} | {manifest_name}
              if len(names) != len(set(names)) or set(names) != expected_names:
                  sys.exit('Safety stop: archive contents differ from its manifest.')
              files = {}
              for name in names:
                  p = pathlib.PurePosixPath(name)
                  if not name.startswith('on-client/') or '..' in p.parts or p.is_absolute():
                      sys.exit('Safety stop: unsafe archive path.')
                  if name != manifest_name:
                      got = hashlib.sha256(archive.read(name)).hexdigest()
                      if got != hashes[name[len('on-client/'):]]:
                          sys.exit('Safety stop: manifest file hash mismatch.')
                  files[name] = archive.read(name)
              for name, content in files.items():
                  dst = pathlib.Path(name)
                  dst.parent.mkdir(parents=True, exist_ok=True)
                  with dst.open('xb') as target:
                      target.write(content)
              print(f'Imported {len(files)} verified starter files to on-client/.')
          PY
      - name: Commit the starter only; remove this temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --force -- on-client
          git rm -- .github/workflows/keshev-starter-import.yml
          git diff --cached --stat
          test "$(git diff --cached --name-only --diff-filter=A | grep '^on-client/' | wc -l)" -eq 57
          git commit -m "chore(keshev): import verified ALEPH starter v0.2.11"
          git push origin HEAD:keshev
