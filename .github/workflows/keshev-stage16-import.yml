name: Keshev 16 verified single-file update
on:
  push:
    branches: [keshev]
    paths:
      - .github/workflows/keshev-stage16-import.yml
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: keshev
          persist-credentials: true
      - name: Verify base and apply student-only stage 16
        shell: bash
        env:
          STATUS_GZIP_B64: 
        run: |
          python3 - <<'PY'
          import base64,gzip,hashlib,os,pathlib,sys
          path=pathlib.Path('on-client/student/extension.mjs')
          old_bytes=path.read_bytes()
          def blob_hash(b):
              return hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          if blob_hash(old_bytes)!='ac3c6df16d354405cf078df444cfbee34e798600':
              sys.exit('Safety stop: original stage 15 code is not the expected version.')
          source=old_bytes.decode('utf-8')
          old_status="    renderStatus() { return '학생 구현 대기: 기기·세션·알림과 연결 점검 상태를 구분하세요.'; },"
          status=gzip.decompress(base64.b64decode(os.environ['STATUS_GZIP_B64'])).decode('utf-8').rstrip('\n')
          if source.count(old_status)!=1: sys.exit('Safety stop: renderStatus placeholder differs.')
          source=source.replace(old_status,status)
          old_action='''        // 15단계는 기록 조회만 구현한다. supportedActions가 있어도 조치 버튼은 만들지 않는다.
                  button.addEventListener('click', () => {'''
          new_action='''        // 16단계: 제공된 미지원 조치만 상세 안에 비활성 안내로 표시한다.
                  // 실제 목록의 supportedActions가 비어 있으면 버튼도 없다. 조치 요청은 보내지 않는다.
                  if (Array.isArray(event?.supportedActions) && event.supportedActions.length > 0) {
                    const unsupported = document.createElement('div');
                    unsupported.className = 'student-unsupported-actions';
                    addText(unsupported, 'p', '조치 실행 연결은 아직 지원하지 않습니다. 이 버튼은 요청을 보내거나 조치를 실행하지 않습니다.', 'muted');
                    for (const action of new Set(event.supportedActions)) {
                      const name = readable(action, '확인되지 않은 조치');
                      const disabled = document.createElement('button');
                      disabled.type = 'button';
                      disabled.className = 'btn';
                      disabled.disabled = true;
                      disabled.setAttribute('aria-disabled', 'true');
                      disabled.setAttribute('aria-label', `${name} 미지원`);
                      disabled.textContent = `${name} 미지원`;
                      unsupported.appendChild(disabled);
                    }
                    detail.appendChild(unsupported);
                  }
                  button.addEventListener('click', () => {'''
          # YAML run-block indentation already preserves each line's exact JS spaces.
          # Do not dedent the source markers before replacing.
          if source.count(old_action)!=1: sys.exit('Safety stop: unsupported action insertion site differs.')
          source=source.replace(old_action,new_action)
          data=source.encode('utf-8')
          if blob_hash(data)!='c96f82cd8c1fb7e38c03a769a8d84d7872b07b7d':
              sys.exit('Safety stop: updated file differs from the locally tested exact bytes.')
          path.write_bytes(data)
          print('Stage 16 source exactly matches tested source:',blob_hash(data))
          PY
      - name: Syntax check and commit the one student file
        shell: bash
        run: |
          node --check on-client/student/extension.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- on-client/student/extension.mjs
          git rm -- .github/workflows/keshev-stage16-import.yml
          git diff --cached --stat
          git commit -m "feat(keshev-16): safe diagnostics, manual retry and unsupported actions"
          git push origin HEAD:keshev
