name: Stage 11 production backdoor surface audit
on:
  push:
    paths:
      - .github/workflows/stage11-backdoor-audit.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unauthenticated-endpoints:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Probe all sensitive endpoints without credentials from an external runner
        shell: bash
        run: |
          set -euo pipefail
          for host in secret-vault-sdydy0298.vercel.app choi-bujang-secret-vault-sdydy0298-dotcom.vercel.app; do
            echo "Auditing public hostname: ${host}"
            while IFS='|' read -r method path; do
              status=$(curl --silent --show-error --max-time 17 --output /tmp/aleph-backdoor-reply --write-out '%{http_code}' \
                --request "${method}" \
                --header 'X-Role: admin' \
                --header 'X-User-Id: aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa' \
                "https://${host}${path}")
              echo "${host} ${method} ${path}: ${status}"
              if [[ "${status}" != "401" ]]; then
                echo "FAIL: public sensitive endpoint did not reject unauthenticated request"
                exit 1
              fi
              if ! grep -q 'UNAUTHORIZED' /tmp/aleph-backdoor-reply; then
                echo "FAIL: rejection did not include expected JSON error"
                exit 1
              fi
            done <<'REQUESTS'
          GET|/api/notes
          POST|/api/notes
          GET|/api/my/notes
          GET|/api/notes/11111111-1111-4111-8111-111111111111
          PUT|/api/notes/11111111-1111-4111-8111-111111111111
          DELETE|/api/notes/11111111-1111-4111-8111-111111111111
          GET|/api/notices
          POST|/api/notices
          GET|/api/notices/11111111-1111-4111-8111-111111111111
          PUT|/api/notices/11111111-1111-4111-8111-111111111111
          GET|/api/device?id=11111111-1111-4111-8111-111111111111
          POST|/api/device
          POST|/api/restore
          REQUESTS
            status=$(curl --silent --show-error --max-time 17 --output /tmp/aleph-data --write-out '%{http_code}' "https://${host}/data.json")
            test "${status}" = '200'
            jq -e '.notes == []' /tmp/aleph-data >/dev/null
            echo "PASS: ${host}: public data.json contains no notes"
          done
          echo 'PASS: all 13 protected routes reject unauthenticated requests on both production hostnames'
