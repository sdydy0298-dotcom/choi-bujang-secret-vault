name: Stage 12 verification and submission bundle
on:
  push:
    branches: [r5-work]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout inspected commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Fresh npm install (bonus criterion)
        run: npm install
      - name: Stage 1-12 complete regression
        run: npm run verify:12
      - name: Local sanitized public build
        run: npm run build -- --local
      - name: Judge-equivalent bundle (no prepare script and no local notes)
        shell: bash
        run: |
          set -euo pipefail
          test ! -e bundle-notes.json
          npm run bundle
          node --input-type=module -e "import {readFileSync} from 'node:fs';const x=JSON.parse(readFileSync('artifacts/submission.json','utf8'));if(x.step!==12 || !x.explanation.includes('기기 등록') || !x.explanation.includes('ALEPH SDP') || x.attackAttempts.length!==20 || !x.attackAttempts.every(v=>v.observed==='not_run'))process.exit(1)"
      - name: Judge-equivalent bundle with stale user-provided notes
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' '{"explanation":"AI에게 작성 부탁함","blockedAt":null}' > bundle-notes.json
          npm run bundle
          node --input-type=module -e "import {readFileSync} from 'node:fs';const x=JSON.parse(readFileSync('artifacts/submission.json','utf8'));if(!x.attackAttempts.every(v=>v.observed==='not_run'))process.exit(1)"
          rm bundle-notes.json
      - name: Confirm Production points at this exact commit
        shell: bash
        env:
          EXPECT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            if curl --silent --show-error --fail --max-time 12 \
              'https://secret-vault-sdydy0298.vercel.app/aleph.json' \
              --output /tmp/stage12-aleph.json; then
              if node -e "const d=require('/tmp/stage12-aleph.json');process.exit(d.step===12&&d.commit===process.env.EXPECT_SHA?0:1)"; then
                echo "PASS: public deployed commit equals GitHub SHA"
                break
              fi
            fi
            if [[ "${attempt}" == "20" ]]; then
              echo "ERROR: production identity was not the submitted commit"
              exit 1
            fi
            sleep 8
          done
      - name: Publish submission JSON (no secrets)
        uses: actions/upload-artifact@v4
        with:
          name: stage12-submission-${{ github.sha }}
          path: artifacts/submission.json
          if-no-files-found: error
          retention-days: 7
