name: Stage 11 verification
on:
  push:
    branches: [r5-work]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Stage 1-11 regression
        run: npm run verify:11
      - name: Build locally
        run: npm run build -- --local
      - name: Prepare stage 11 submission
        run: npm run prepare:11
      - name: Bundle submission
        run: npm run bundle
