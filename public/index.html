<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BYTE BACK | 인증된 자료실</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #101a28; color: #ecf4ff; }
    main { max-width: 860px; margin: 0 auto; padding: 44px 22px 64px; }
    .eyebrow { color: #8ad8df; font-size: 14px; font-weight: 700; letter-spacing: .08em; }
    h1 { margin: 16px 0; font-size: clamp(30px, 7vw, 48px); line-height: 1.2; }
    p { font-size: 17px; line-height: 1.7; color: #bfd0e5; }
    .notice { margin: 26px 0; padding: 18px; border: 1px solid #d4a85b; border-radius: 14px; color: #fff1cd; background: #5d472844; }
    .panel { margin: 26px 0; padding: 20px; border: 1px solid #51667c; border-radius: 14px; background: #162538; }
    .head { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
    .head strong { font-size: 19px; }
    .state { color: #8ad8df; font-size: 14px; font-weight: 700; }
    form { display: grid; gap: 12px; }
    label { display: grid; gap: 7px; color: #bfd0e5; font-size: 14px; }
    input, textarea { width: 100%; border: 1px solid #51667c; border-radius: 10px; background: #101a28; color: #ecf4ff; padding: 12px 13px; font: inherit; }
    textarea { min-height: 110px; resize: vertical; }
    input:focus, textarea:focus { outline: 2px solid #8ad8df; outline-offset: 1px; }
    button { border: 0; border-radius: 10px; padding: 11px 15px; background: #8ad8df; color: #10202d; font: inherit; font-weight: 800; cursor: pointer; }
    button:disabled { opacity: .55; cursor: wait; }
    .secondary { background: #26394e; color: #ecf4ff; border: 1px solid #51667c; }
    .danger { background: #5b2d38; color: #ffe3e8; border: 1px solid #8a4657; }
    .message { min-height: 24px; margin: 12px 0 0; color: #bfd0e5; font-size: 14px; }
    .message.error { color: #ffb8c4; }
    .session-box { display: none; gap: 12px; }
    .session-box[data-visible="true"] { display: grid; }
    .session-email { word-break: break-all; color: #ecf4ff; }
    .note-create { display: none; }
    .note-create[data-visible="true"] { display: grid; }
    ul { list-style: none; display: grid; gap: 12px; padding: 0; }
    li { border: 1px solid #51667c; border-radius: 14px; padding: 17px 19px; background: #1a2a3d; }
    li strong { display: block; font-size: 18px; margin-bottom: 5px; }
    li .body { color: #bfd0e5; white-space: pre-wrap; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
    .actions button { font-size: 14px; padding: 9px 12px; }
    .edit-form { margin-top: 14px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">BYTE BACK · 5단계 서버 집중</div>
    <h1>내 자료실</h1>
    <p>메모 자료 요청은 Vercel 서버 함수에 모으고 원본 저장소의 직접 접근 권한은 차단합니다.</p>
    <div class="notice">로그인은 Supabase Auth를 유지하고, 메모 읽기·추가·수정·삭제는 서버 함수만 호출합니다.</div>

    <section class="panel" aria-labelledby="auth-title">
      <div class="head">
        <strong id="auth-title">계정 인증</strong>
        <span id="auth-state" class="state">확인 중</span>
      </div>

      <form id="login-form">
        <label>이메일
          <input id="email" name="email" type="email" autocomplete="username" required>
        </label>
        <label>비밀번호
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </label>
        <button id="login-button" type="submit">로그인</button>
      </form>

      <div id="session-box" class="session-box">
        <div>
          <div class="state">로그인됨</div>
          <div id="session-email" class="session-email"></div>
        </div>
        <button id="logout-button" class="secondary" type="button">로그아웃</button>
      </div>

      <p id="auth-message" class="message" role="status" aria-live="polite"></p>
    </section>

    <section id="note-create" class="panel note-create" aria-labelledby="create-title">
      <div class="head"><strong id="create-title">새 가상 메모</strong></div>
      <form id="create-form">
        <label>제목
          <input id="note-title" maxlength="200" required>
        </label>
        <label>내용
          <textarea id="note-body" maxlength="5000"></textarea>
        </label>
        <button type="submit">추가</button>
      </form>
      <p id="note-message" class="message" role="status" aria-live="polite"></p>
    </section>

    <ul id="notes" aria-live="polite"><li>로그인 상태를 확인하는 중입니다.</li></ul>
  </main>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/+esm';

    const authConfigResponse = await fetch('/api/auth-config', { cache: 'no-store' });
    if (!authConfigResponse.ok) throw new Error('인증 설정을 불러올 수 없습니다.');
    const authConfig = await authConfigResponse.json();
    const supabase = createClient(authConfig.url, authConfig.publishableKey);

    const loginForm = document.querySelector('#login-form');
    const emailInput = document.querySelector('#email');
    const passwordInput = document.querySelector('#password');
    const loginButton = document.querySelector('#login-button');
    const logoutButton = document.querySelector('#logout-button');
    const sessionBox = document.querySelector('#session-box');
    const sessionEmail = document.querySelector('#session-email');
    const authState = document.querySelector('#auth-state');
    const authMessage = document.querySelector('#auth-message');
    const createPanel = document.querySelector('#note-create');
    const createForm = document.querySelector('#create-form');
    const noteTitle = document.querySelector('#note-title');
    const noteBody = document.querySelector('#note-body');
    const noteMessage = document.querySelector('#note-message');
    const list = document.querySelector('#notes');

    let currentSession = null;

    function showMessage(target, message = '', isError = false) {
      target.textContent = message;
      target.classList.toggle('error', isError);
    }

    function renderNotesMessage(message) {
      const item = document.createElement('li');
      item.textContent = message;
      list.replaceChildren(item);
    }

    function authHeaders(session, json = false) {
      const headers = { Authorization: 'Bearer ' + session.access_token };
      if (json) headers['Content-Type'] = 'application/json';
      return headers;
    }

    async function api(path, options = {}) {
      if (!currentSession?.access_token) throw new Error('로그인이 필요합니다.');
      const response = await fetch(path, {
        cache: 'no-store',
        ...options,
        headers: {
          ...authHeaders(currentSession, Boolean(options.body)),
          ...(options.headers ?? {}),
        },
      });
      let data = null;
      try { data = await response.json(); } catch {}
      if (!response.ok) {
        if (response.status === 401) throw new Error('로그인 확인에 실패했습니다. 다시 로그인해 주세요.');
        if (response.status === 404) throw new Error('메모를 찾을 수 없습니다.');
        throw new Error(data?.error ?? '자료 요청에 실패했습니다.');
      }
      return data;
    }

    function noteElement(note) {
      const item = document.createElement('li');

      const title = document.createElement('strong');
      title.textContent = note.title;

      const body = document.createElement('div');
      body.className = 'body';
      body.textContent = note.body;

      const actions = document.createElement('div');
      actions.className = 'actions';

      const edit = document.createElement('button');
      edit.type = 'button';
      edit.className = 'secondary';
      edit.textContent = '수정';

      const remove = document.createElement('button');
      remove.type = 'button';
      remove.className = 'danger';
      remove.textContent = '삭제';

      edit.addEventListener('click', () => {
        const existingForm = item.querySelector('.edit-form');
        if (existingForm) {
          existingForm.querySelector('input')?.focus();
          return;
        }

        edit.disabled = true;

        const form = document.createElement('form');
        form.className = 'edit-form';

        const titleInput = document.createElement('input');
        titleInput.value = note.title;
        titleInput.maxLength = 200;
        titleInput.required = true;

        const bodyInput = document.createElement('textarea');
        bodyInput.value = note.body;
        bodyInput.maxLength = 5000;

        const save = document.createElement('button');
        save.type = 'submit';
        save.textContent = '저장';

        const cancel = document.createElement('button');
        cancel.type = 'button';
        cancel.className = 'secondary';
        cancel.textContent = '취소';

        const row = document.createElement('div');
        row.className = 'actions';
        row.append(save, cancel);
        form.append(titleInput, bodyInput, row);

        cancel.addEventListener('click', () => {
          form.remove();
          edit.disabled = false;
        });

        form.addEventListener('submit', async (event) => {
          event.preventDefault();
          save.disabled = true;
          try {
            await api('/api/notes/' + encodeURIComponent(note.id), {
              method: 'PUT',
              body: JSON.stringify({ title: titleInput.value, body: bodyInput.value }),
            });
            await loadNotes();
          } catch (error) {
            showMessage(noteMessage, error.message, true);
          } finally {
            save.disabled = false;
            if (document.body.contains(item)) edit.disabled = false;
          }
        });

        item.append(form);
        titleInput.focus();
      });

      remove.addEventListener('click', async () => {
        remove.disabled = true;
        try {
          await api('/api/notes/' + encodeURIComponent(note.id), { method: 'DELETE' });
          await loadNotes();
        } catch (error) {
          showMessage(noteMessage, error.message, true);
          remove.disabled = false;
        }
      });

      actions.append(edit, remove);
      item.append(title, body, actions);
      return item;
    }

    async function loadNotes() {
      if (!currentSession) {
        renderNotesMessage('로그인 후 가상 자료를 볼 수 있습니다.');
        return;
      }
      try {
        const data = await api('/api/notes');
        if (!Array.isArray(data.notes)) throw new Error('자료 형식이 맞지 않습니다.');
        if (!data.notes.length) {
          renderNotesMessage('등록된 가상 메모가 없습니다.');
          return;
        }
        list.replaceChildren(...data.notes.map(noteElement));
      } catch (error) {
        renderNotesMessage(error.message);
      }
    }

    function renderSession(session) {
      currentSession = session ?? null;
      const loggedIn = Boolean(currentSession?.user);

      loginForm.hidden = loggedIn;
      sessionBox.dataset.visible = String(loggedIn);
      createPanel.dataset.visible = String(loggedIn);
      sessionEmail.textContent = currentSession?.user?.email ?? '';
      authState.textContent = loggedIn ? '로그인됨' : '로그아웃됨';

      if (!loggedIn) {
        passwordInput.value = '';
        showMessage(noteMessage, '');
      }
      void loadNotes();
    }

    loginForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      loginButton.disabled = true;
      showMessage(authMessage, '로그인 확인 중입니다.');

      const { data, error } = await supabase.auth.signInWithPassword({
        email: emailInput.value.trim(),
        password: passwordInput.value,
      });

      loginButton.disabled = false;
      if (error) {
        renderSession(null);
        showMessage(authMessage, '로그인 실패: ' + error.message, true);
        return;
      }

      renderSession(data.session);
      showMessage(authMessage, '로그인되었습니다.');
    });

    logoutButton.addEventListener('click', async () => {
      logoutButton.disabled = true;
      const { error } = await supabase.auth.signOut();
      logoutButton.disabled = false;

      if (error) {
        showMessage(authMessage, '로그아웃 실패: ' + error.message, true);
        return;
      }
      renderSession(null);
      showMessage(authMessage, '로그아웃되었습니다.');
    });

    createForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      const button = createForm.querySelector('button[type="submit"]');
      button.disabled = true;
      showMessage(noteMessage, '메모를 추가하는 중입니다.');

      try {
        await api('/api/notes', {
          method: 'POST',
          body: JSON.stringify({ title: noteTitle.value, body: noteBody.value }),
        });
        createForm.reset();
        showMessage(noteMessage, '메모가 추가되었습니다.');
        await loadNotes();
      } catch (error) {
        showMessage(noteMessage, error.message, true);
      } finally {
        button.disabled = false;
      }
    });

    supabase.auth.onAuthStateChange((_event, session) => renderSession(session));

    const { data: sessionData, error: sessionError } = await supabase.auth.getSession();
    if (sessionError) {
      renderSession(null);
      showMessage(authMessage, '로그인 상태 확인 실패: ' + sessionError.message, true);
    } else {
      renderSession(sessionData.session);
    }
  </script>
</body>
</html>
